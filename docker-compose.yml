version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: soromint-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: soromint

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soromint-server
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongodb:27017/soromint
      METRICS_USERNAME: ${METRICS_USERNAME:-prometheus}
      METRICS_PASSWORD: ${METRICS_PASSWORD:-soromint-metrics}
      LOKI_HOST: http://loki:3100
    depends_on:
      - mongodb
    restart: unless-stopped

  event-indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soromint-event-indexer
    command: npm run indexer
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongodb:27017/soromint
      METRICS_USERNAME: ${METRICS_USERNAME:-prometheus}
      METRICS_PASSWORD: ${METRICS_PASSWORD:-soromint-metrics}
      LOKI_HOST: http://loki:3100
    depends_on:
      - mongodb
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: soromint-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - server

  loki:
    image: grafana/loki:3.5.3
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

volumes:
  mongodb_data:
  loki_data:
  grafana_data:
