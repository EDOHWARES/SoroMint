version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: soromint-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: soromint

  redis:
    image: redis:latest
    container_name: soromint-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  stellar-quickstart:
    image: stellar/quickstart:latest
    container_name: soromint-stellar
    ports:
      - "8000:8000"
      - "80:80"
    environment:
      - STELLAR_LOCAL_STANDALONE_MODE=true
      - FRIENDBOT_URL=http://localhost:8000/friendbot
      - RPC_PORT=8000
      - HORIZON_PORT=80
      - NETWORK_PASSPHRASE=Standalone Network ; February 2017
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soromint-server
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongodb:27017/soromint
      SOROBAN_RPC_URL: http://stellar-quickstart:8000
      NETWORK_PASSPHRASE: Standalone Network ; February 2017
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
      stellar-quickstart:
        condition: service_healthy
    restart: unless-stopped

  event-indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soromint-event-indexer
    command: npm run indexer
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongodb:27017/soromint
      SOROBAN_RPC_URL: http://stellar-quickstart:8000
      NETWORK_PASSPHRASE: Standalone Network ; February 2017
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
      stellar-quickstart:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: soromint-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongodb_data:
